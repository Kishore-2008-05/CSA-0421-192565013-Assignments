# Second service (learning-management system) with its OWN resource limits, same cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lms
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lms
  template:
    metadata:
      labels:
        app: lms
    spec:
      containers:
      - name: lms
        image: simats/lms:1.0   # placeholder image name
        ports:
        - containerPort: 8000
        resources:
          requests: {cpu: 200m, memory: 256Mi}
          limits: {cpu: 400m, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: lms
spec:
  selector:
    app: lms
  ports:
  - port: 80
    targetPort: 8000
