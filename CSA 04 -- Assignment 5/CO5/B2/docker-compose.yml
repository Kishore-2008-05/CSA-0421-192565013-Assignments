services:
  portal:
    build: .
    image: result-portal
    ports: ["8000:8000"]
    depends_on: [db]
    deploy:
      resources:
        limits: {cpus: "0.50", memory: 256M}
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: change-me-in-real-use
    volumes: [dbdata:/var/lib/postgresql/data]
    deploy:
      resources:
        limits: {cpus: "0.50", memory: 512M}
volumes:
  dbdata:
