services:
  portal:
    build: .
    image: result-portal:local
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://portal:portalpass@db:5432/results
    depends_on:
      db:
        condition: service_healthy
    cpus: 0.50
    mem_limit: 512m
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: results
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portalpass
    volumes:
      - result-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d results"]
      interval: 5s
      timeout: 3s
      retries: 10
    cpus: 1.0
    mem_limit: 1g
    restart: unless-stopped
  lms-demo:
    image: nginx:alpine
    ports:
      - "8081:80"
    cpus: 0.25
    mem_limit: 128m
    restart: unless-stopped
volumes:
  result-data:
