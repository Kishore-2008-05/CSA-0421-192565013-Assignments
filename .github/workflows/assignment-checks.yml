name: Compile assignment programs
on:
  push:
    paths:
      - "CSA 04 -- Assignment 3/**"
      - "CSA 04 --Assignment 4/**"
      - "CSA 04 -- Assignment 5/**"
      - ".github/workflows/assignment-checks.yml"
  workflow_dispatch:
jobs:
  c-programs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GCC
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: Compile CO3
        run: |
          cd "CSA 04 -- Assignment 3"
          gcc -std=c11 -Wall -Wextra Task01/crypto_plugin.c -fPIC -shared -o /tmp/libcrypto_plugin.so
          gcc -std=c11 -Wall -Wextra Task01/link_demo.c -o /tmp/link_demo -ldl
          for f in Task03/segmentation.c Task04/demand_paging.c Task06/raid_capacity.c Task07/mlock_latency.c; do
            gcc -std=c11 -Wall -Wextra "$f" -o "/tmp/$(basename "$f" .c)"
          done
          gcc -std=c11 -Wall -Wextra Task02/paging_translation.c -o /tmp/paging_translation
          gcc -std=c11 -Wall -Wextra Task05/page_replacement.c -o /tmp/page_replacement
      - name: Compile CO4
        run: |
          cd "CSA 04 --Assignment 4"
          for f in Task02/file_allocation.c Task02/inode_capacity.c Task04/disk_scheduling.c Task04/disk_scheduling_all.c Task04/disk_queue_simulation.c Task06/storage_workload.c; do
            gcc -std=c11 -Wall -Wextra "$f" -o "/tmp/$(basename "$f" .c)"
          done
      - name: Run portable simulations
        run: |
          /tmp/paging_translation
          /tmp/page_replacement
          /tmp/segmentation
          /tmp/raid_capacity
          /tmp/file_allocation
          /tmp/inode_capacity
          /tmp/disk_scheduling
          /tmp/disk_scheduling_all
          /tmp/storage_workload
          bash "CSA 04 -- Assignment 5/TaskB1/log_summary.sh"
